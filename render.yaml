services:
  - type: web
    name: zahavi-api
    runtime: node
    region: ohio       # us-east-2 — más cercano a Colombia que us-west
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter "@zahavi/api..." build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false    # Supabase > Settings > Database > Connection string > modo "Session" (puerto 5432, NO Transaction/6543 — la API usa Pool persistente)
      - key: JWT_SECRET
        generateValue: true   # Render genera un secreto seguro automáticamente
      - key: CORS_ORIGIN
        sync: false    # URL de Vercel, ej: https://zahavi-web.vercel.app (sin barra final)
      - key: LOG_LEVEL
        value: info
