services:
  - type: web
    name: zahavi-api
    runtime: node
    region: ohio       # us-east-2 — más cercano a Colombia que us-west
    plan: free
    rootDir: .
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile && pnpm --filter @zahavi/api build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false    # configurar manualmente en dashboard: Supabase > Settings > Database > Connection string (mode=transaction)
      - key: JWT_SECRET
        generateValue: true   # Render genera uno seguro automáticamente
      - key: CORS_ORIGIN
        sync: false    # configurar con la URL de Vercel, ej: https://zahavi.vercel.app
